site_name: HandyUI Documentation
site_url: https://davpnuser.github.io/HandyUI/
site_author: davpnuser
site_description: The documentation for HandyUI, Powered by Material for MkDocs.

repo_name: davpnuser/HandyUI
repo_url: https://github.com/davpnuser/HandyUI

theme:
  name: material
  features:
    - content.tabs.link
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
  font:
    text: Roboto
    code: Roboto Mono
  logo: assets/logo.png
  favicon: assets/favicon.png

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg ""
      emoji_index: !!python/name:material.extensions.emoji.twemoji ""
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quickstart: getting-started/quickstart.md
  - API Reference:
    - Index: api/index.md
    - Core:
      - Abstractions:
        - IControl: api/icontrol.md
        - IModule: api/imodule.md
        - IHostWindow: api/ihostwindow.md
        - BaseControl: api/base-control.md
        - BaseModule: api/base-module.md
      - Components:
        - UIRenderer: api/ui-renderer.md
        - UpdateContext: api/update-context.md
        - ProfilerControl: api/profiler-control.md
      - Data:
        - Input Contexts: api/contexts.md
        - Tween: api/tween.md
      - Helpers:
        - TweenManager: api/tween-manager.md
        - ThemeManager: api/theme-manager.md
        - FontManager: api/font-manager.md
        - ResourceManager: api/resource-manager.md
        - SkiaSharp Extensions: api/sk-extensions.md
      - Enums: api/enums.md
    - Controls:
      - Overview: api/controls/index.md
      - Enums: api/controls/enums.md
      - Button: api/controls/button.md
      - CheckBox: api/controls/check-box.md
      - Frame: api/controls/frame.md
      - ItemBox: api/controls/item-box.md
      - Label: api/controls/label.md
      - ListBox: api/controls/list-box.md
      - MultilineTextInput: api/controls/multiline-text-input.md
      - Picture: api/controls/picture.md
      - PictureButton: api/controls/picture-button.md
      - ProgressBar: api/controls/progress-bar.md
      - ScrollFrame: api/controls/scroll-frame.md
      - Slider: api/controls/slider.md
      - TextInput: api/controls/text-input.md
      - Toggle: api/controls/toggle.md
    - Silk.NET Adapter:
      - HandyWindow: api/handy-window.md
      - WindowConfiguration: api/window-configuration.md
      - TrayIcon: api/tray-icon.md
      - TrayMenuItem: api/tray-menu-item.md
      - ThemeHelper: api/theme-helper.md
      - Silk.NET Helpers: api/silknet-helpers.md
      - VectorExtensions: api/vector-extensions.md
  - Extras:
    - Branding: extras/branding.md
extra:
  version:
    provider: mike

