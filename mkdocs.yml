site_name: HandyUI Documentation
site_url: https://github.com/davpnuser/HandyUI
site_author: davpnuser
site_description: The documentation for HandyUI, Powered by Material for MkDocs.

repo_name: davpnuser/HandyUI
repo_url: https://github.com/davpnuser/HandyUI

theme:
  name: material
  features:
    - content.tabs.link
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
  font:
    text: Roboto
    code: Roboto Mono
  logo: assets/logo.png
  favicon: assets/favicon.png

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg ""
      emoji_index: !!python/name:material.extensions.emoji.twemoji ""
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quickstart: getting-started/quickstart.md
  - API Reference:
    - Index: api/index.md
    - Core:
      - UIRenderer: api/ui-renderer.md
      - ResourceManager: api/resource-manager.md
      - BaseControl: api/base-control.md
      - BaseModule: api/base-module.md
    - Interfaces:
      - IControl: api/icontrol.md
      - IModule: api/imodule.md
    - Records & Contexts:
      - Input Contexts: api/contexts.md
      - Theme: api/theme.md
    - Helpers:
      - SKColorHelper: api/sk-color-helper.md
      - SKRectHelper: api/sk-rect-helper.md
    - Enums:
      - BorderDirection: api/border-direction.md
    - Controls:
      - Overview: api/controls/index.md
      - CheckBox: api/controls/check-box.md
      - Frame: api/controls/frame.md
      - ImageButton: api/controls/image-button.md
      - ImageLabel: api/controls/image-label.md
      - TextBox: api/controls/text-box.md
      - TextButton: api/controls/text-button.md
      - TextLabel: api/controls/text-label.md
    - Silk.NET Adapter:
      - HandyWindow: api/handy-window.md
      - WindowConfiguration: api/window-configuration.md
      - Silk.NET Helpers: api/silknet-helpers.md
      - VectorExtensions: api/vector-extensions.md
